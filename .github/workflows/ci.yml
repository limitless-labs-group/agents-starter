name: CI

# Gates every PR (incl. Dependabot SDK/dep bumps) on type-check + tests on
# both supported Node lines. The SDK contract tests (tests/unit/sdk-surface,
# tests/unit/sdk-signing) make a breaking @limitless-exchange/sdk change fail
# here instead of at a live run. No test touches the network.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
